#wk121Life .c121{opacity:.62}
#wk121Life .flap{animation:wk121flap .32s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
#wk121Life .legL{animation:wk121leg .55s ease-in-out infinite;transform-box:fill-box;transform-origin:center top}

#wk121Life .sweep{animation:wk121sweep .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center top}
#wk121Life .tail{animation:wk121tail .4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
#wk121Life .sway{animation:wk121sway 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
#wk121Life .juggle{animation:wk121jug .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
#wk121Life .flash{animation:wk121flash 2.6s steps(1) infinite}
#wk121Life .peck{animation:wk121peck .9s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom}
#wk121Life .wing{animation:wk121wing .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
