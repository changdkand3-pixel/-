<style id="wk116-fighters-style">
#wk116Arena{position:absolute;left:78.5%;top:70.5%;width:19%;z-index:56;padding:0;margin:0;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#wk116Arena img{display:block;width:100%;height:auto;margin-bottom:-9%;position:relative;z-index:2;filter:drop-shadow(0 2px 3px #0008);transition:transform .2s}
#wk116Arena svg{display:block;width:78%;height:auto;position:relative;z-index:1}
#wk116Arena .wk116-label{position:relative;z-index:3;margin-top:-8%;padding:.25em .8em;border-radius:999px;background:linear-gradient(#7a3b1d,#4f220d);color:#fff;border:2px solid #ffe7a8;font:900 clamp(8px,1.25vw,15px)/1.2 system-ui,'Malgun Gothic',sans-serif;white-space:nowrap;box-shadow:0 2px 4px #0007}
#wk116Arena:hover img,#wk116Arena:focus-visible img{transform:scale(1.06) translateY(-3%)}
#wk116Arena:focus-visible{outline:3px solid #ffe259;outline-offset:2px;border-radius:12px}
body:has(.modal.open) #wk116Arena{visibility:hidden}
#wk116Fighters{position:fixed;inset:0;z-index:100020;background:#000c;display:flex;align-items:center;justify-content:center;padding:12px;font-family:system-ui,'Malgun Gothic',sans-serif}
#wk116Fighters[hidden]{display:none}
#wk116Fighters .f-card{position:relative;width:min(100%,640px);max-height:94vh;overflow:auto;background:radial-gradient(circle at 50% 0,#2b2f6b,#0f1230 70%);color:#fff;border:3px solid #ffc94d;border-radius:20px;box-shadow:0 14px 40px #000a;text-align:center;padding:14px 16px 18px}
#wk116Fighters .f-logo{display:block;width:100%;height:auto;border-radius:12px}
#wk116Fighters .f-x{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:2px solid #fff6;background:#0008;color:#fff;font-size:20px;cursor:pointer;z-index:2}
#wk116Fighters h2{margin:8px 0 4px;font-size:clamp(18px,4.8vw,24px);font-weight:900;color:#ffe08a}
#wk116Fighters .f-sub{margin:0 0 12px;color:#d9ddff;font-size:14px}
#wk116Fighters .f-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
#wk116Fighters .f-tags span{background:#ffffff1c;border:1px solid #ffffff40;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
#wk116Fighters .f-go{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:14px;background:linear-gradient(#ffd34d,#ff8a1f);color:#3a1600;font-weight:900;font-size:17px;text-decoration:none;box-shadow:0 4px 0 #b35500,0 6px 16px #0007}
#wk116Fighters .f-go:active{transform:translateY(2px);box-shadow:0 2px 0 #b35500}
#wk116Fighters ol{text-align:left;margin:16px auto 6px;padding-left:22px;max-width:440px;font-size:14px;line-height:1.6;color:#eef}
#wk116Fighters .f-note{margin:8px 0 0;font-size:13px;color:#ffd0d0}
</style>
