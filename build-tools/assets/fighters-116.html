<style id="wk116-fighters-style">
#wk116Arena{position:absolute;left:79.5%;top:68.5%;width:17%;z-index:56;padding:0;margin:0;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

#wk116Fighters .f-go{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:14px;background:linear-gradient(#ffd34d,#ff8a1f);color:#3a1600;font-weight:900;font-size:17px;text-decoration:none;box-shadow:0 4px 0 #b35500,0 6px 16px #0007}

#wk116Fighters .f-lock[hidden],#wk116Fighters .f-note[hidden]{display:none}
#wk116Fighters .f-lk{margin:4px 0 12px;font-size:15px;line-height:1.5;color:#fff3c4}
#wk116Fighters .f-pw{display:block;margin:0 auto 12px;width:min(220px,80%);padding:11px 14px;border-radius:12px;border:2px solid #ffc94d;background:#0d0f2a;color:#fff;font-size:22px;letter-spacing:.3em;text-align:center}
#wk116Fighters .f-go{border:0;cursor:pointer;font-family:inherit}
#wk116Fighters .f-err{min-height:1.2em;margin:10px 0 0;color:#ff9b9b;font-weight:700;font-size:14px}
#wk116Fighters .f-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
#wk116Fighters .f-op{background:linear-gradient(#9ee7ff,#3aa0ff);color:#06264a;box-shadow:0 4px 0 #1d5fb0,0 6px 16px #0007}
#wk116Fighters .f-music{margin:6px auto 0;max-width:460px;text-align:left;font-size:13px;line-height:1.55;color:#d9f2ff;background:#ffffff12;border-radius:10px;padding:8px 10px}
#wk116Fighters .f-note{margin:8px 0 0;font-size:13px;color:#ffd0d0}
</style>
<script id="wk116-fighters-js">(function(){'use strict';
/* 117차: 게임 주소는 비밀번호로 잠가 둠(URLX = patch.py가 비밀번호로 섞어 넣음). 주소·비밀번호를 바꿀 때는 patch.py 116 부분의 _fi_url·_fi_pw */

 +'<ellipse cx="100" cy="100" rx="96" ry="10" fill="#0003"/>'
 +'<path d="M8 44 Q100 18 192 44 L188 98 Q100 112 12 98Z" fill="url(#wk116w)" stroke="#8a5523" stroke-width="2.5"/>'
 +'<path d="M10 58 Q100 36 190 58" fill="none" stroke="#c98a3d" stroke-width="2"/><path d="M11 74 Q100 54 189 74" fill="none" stroke="#c98a3d" stroke-width="2"/>'
 +[24,44,64,84,116,136,156,176].map(function(x){var y=x<100?47-(x-8)*0.22:47-(192-x)*0.22;return '<rect x="'+(x-5)+'" y="'+(y+18)+'" width="10" height="14" rx="5" fill="#5a2f14"/><rect x="'+(x-5)+'" y="'+(y+38)+'" width="10" height="14" rx="5" fill="#5a2f14"/>';}).join('')
 +'<path d="M76 101 L76 72 Q100 56 124 72 L124 103Z" fill="#3a1a0a" stroke="#8a5523" stroke-width="2.5"/><path d="M84 101 L84 76 Q100 66 116 76 L116 102Z" fill="#ffcf4d" opacity=".85"/>'
 +'<path d="M70 70 Q100 52 130 70 L130 62 Q100 44 70 62Z" fill="url(#wk116r)" stroke="#7a0f12" stroke-width="1.5"/>'

 +'<path d="M14 14 L34 19 L14 25Z" fill="#2f6bff"/><path d="M186 14 L166 19 L186 25Z" fill="#c33cff"/><path d="M100 4 L118 9 L100 15Z" fill="#ff3b3b"/>'
 +'</svg>';
function el(t,c,p){var e=document.createElement(t);if(c)e.className=c;if(p)p.appendChild(e);return e;}
function modal(){var m=document.getElementById('wk116Fighters');if(m)return m;
 m=el('div');m.id='wk116Fighters';m.hidden=true;m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label',GAME.name);
 m.innerHTML='<div class="f-card"><button type="button" class="f-x" aria-label="닫기">✕</button>'
  +'<img class="f-logo" alt="'+GAME.name+'" src="'+LOGO+'">'
  +'<h2>🥊 원기랜드 격투 대회 개막!</h2><p class="f-sub">원기랜드가 주최하는 격투 게임 「'+GAME.name+'」</p>'
  +'<div class="f-tags"><span>💻 Windows PC용</span><span>🏷️ '+GAME.version+'</span><span>⌨️ 키보드</span><span>🕹️ 조이스틱 지원</span></div>'
  +'<div class="f-lock" data-v="visitor"><p class="f-lk">🔒 방문자는 입장할 수 없어요.<br><b>일반회원 로그인</b> 후 이용할 수 있어요.</p><button type="button" class="f-go f-login">👤 일반회원 로그인</button></div>'
  +'<form class="f-lock" data-v="pw" autocomplete="off"><p class="f-lk">🔑 입장 비밀번호를 넣어 주세요.</p><input class="f-pw" type="password" inputmode="numeric" maxlength="12" aria-label="입장 비밀번호" placeholder="비밀번호"><button type="submit" class="f-go">입장</button><p class="f-err" aria-live="polite"></p></form>'
  +'<div class="f-lock" data-v="ok"><div class="f-btns"><a class="f-go f-dl" target="_blank" rel="noopener">① ⬇️ 게임 받기</a><a class="f-go f-op" target="_blank" rel="noopener">② 🎬 오프닝 영상 받기</a></div>'
  +'<ol><li><b>①</b>을 누르면 구글 드라이브가 열려요. 오른쪽 위 <b>다운로드</b>로 받은 뒤 zip을 <b>압축 풀기</b> 하세요.</li><li><b>②</b>도 같은 방법으로 받으세요. 압축을 푼 게임 폴더(<b>WongilandFighters2026.exe</b>가 있는 곳)에 <b>opening</b> 폴더를 새로 만들고 받은 영상을 그 안에 넣으세요.</li><li><b>WongilandFighters2026.exe</b>를 두 번 눌러 시작!</li></ol>'
  +'<p class="f-music">🎵 음악 파일은 들어 있지 않아요. 게임 폴더의 <b>music</b> 폴더 안 01~08 칸에 갖고 있는 MP3를 넣으면 그 화면에서 나와요(칸마다 「여기에 음악을 넣으세요」 안내가 있어요).</p></div>'
  +'<p class="f-note">📱 휴대폰·태블릿에서는 실행되지 않아요. Windows 컴퓨터에서 받아 주세요.</p></div>';
 document.body.appendChild(m);
 m.addEventListener('click',function(e){if(e.target===m||e.target.closest('.f-x'))close();else if(e.target.closest('.f-login')){close();var lb=document.getElementById('wonkiGeneralAccountButton');if(lb)lb.click();else alert('메인 화면의 [👤 일반회원 로그인]을 눌러 주세요.');}});
 m.querySelector('form').addEventListener('submit',function(e){e.preventDefault();var i=m.querySelector('.f-pw'),u=unlock(i.value.trim());if(u){m.querySelector('.f-dl').href=u;var u2=unlock(i.value.trim(),URLX2);if(u2)m.querySelector('.f-op').href=u2;show('ok');}else{m.querySelector('.f-err').textContent='비밀번호가 맞지 않아요.';i.value='';i.focus();}});
 return m;}
function who(){try{if(localStorage.getItem('wk65_admin_device')==='1')return 'owner';}catch(_){}try{var s=JSON.parse(sessionStorage.getItem('wonkiLand_general_session_v1')||'null');if(s&&s.token)return 'member';}catch(_){}return 'visitor';}

function unlock(pw,X){X=X||URLX;var t='wk116|'+pw,h=0x811c9dc5,b=new TextEncoder().encode(t),i;for(i=0;i<b.length;i++){h^=b[i];h=Math.imul(h,0x01000193)>>>0;}var x=h||1,out=[];for(i=0;i<X.length;i+=2){x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;out.push(parseInt(X.substr(i,2),16)^(x&255));}var u;try{u=new TextDecoder('utf-8',{fatal:true}).decode(new Uint8Array(out));}catch(_){return null;}return /^https:\/\/drive\.google\.com\//.test(u)?u:null;}
function show(v){var m=modal();m.querySelectorAll('.f-lock').forEach(function(n){n.hidden=n.getAttribute('data-v')!==v;});var f=m.querySelector('.f-note');f.hidden=v!=='ok';if(v==='pw'){m.querySelector('.f-err').textContent='';var i=m.querySelector('.f-pw');i.value='';setTimeout(function(){try{i.focus({preventScroll:true});}catch(_){}},30);}}
var last=null;
function open(){var m=modal();last=document.activeElement;m.querySelector('.f-dl').removeAttribute('href');m.querySelector('.f-op').removeAttribute('href');m.hidden=false;var v=who()==='visitor'?'visitor':'pw';show(v);if(v==='visitor'){try{m.querySelector('.f-x').focus({preventScroll:true});}catch(_){}}}
function close(){var m=document.getElementById('wk116Fighters');if(!m||m.hidden)return;m.hidden=true;try{last&&last.focus&&last.focus({preventScroll:true});}catch(_){}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
function place(){var st=document.getElementById('mainStage');if(!st||document.getElementById('wk116Arena'))return;
 var b=el('button');b.type='button';b.id='wk116Arena';b.setAttribute('aria-label',GAME.name+' 경기장');
 b.innerHTML='<img alt="" src="'+SIGN+'" draggable="false">'+ARENA+'<span class="wk116-label">원기랜드의 파이터즈 2026</span>';
 b.addEventListener('pointerdown',function(e){e.stopPropagation();});
 b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();open();});
 st.appendChild(b);}
window.wk116Fighters={open:open,close:close,game:GAME};

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();</script>
