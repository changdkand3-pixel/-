/* 장수 등록 화면 */
function showGens(){var ov=root.querySelector('[data-ov="gens"]'),R=reg();
 function row(g,k){return '<tr data-k="'+k+'"><td><input data-f="name" maxlength="12" value="'+esc(g.name||'')+'" placeholder="이름"></td><td><select data-f="f"><option value="-1">무작위</option>'+FAC.map(function(f,fi){return '<option value="'+fi+'"'+(+g.f===fi?' selected':'')+'>'+esc(f[0])+'</option>';}).join('')+'</select></td>'
  +['war','int','lead','pol'].map(function(x){return '<td><input type="number" min="1" max="100" data-f="'+x+'" value="'+(+g[x]||50)+'"></td>';}).join('')+'<td><input type="checkbox" data-f="lord"'+(g.lord?' checked':'')+' style="width:auto"></td><td><button class="mini" data-g="dice" title="능력치 무작위">🎲</button> <button class="mini" data-g="del" title="지우기">🗑</button></td></tr>';}
 ov.innerHTML='<div class="card"><h3>👥 장수 등록</h3><p style="margin:0 0 8px;font-size:13px;line-height:1.6">기본 장수 '+QB.gens.length+'명(연예인 '+QB.celeb+'명 + 가상 이름)이 이미 들어 있어요. 여기에는 <b>지인</b>을 넣으세요. 지인 이름과 능력치(1~100)를 넣으면 <b>새 게임부터</b> 장수로 나와 역의 태수가 돼요. 무력=공격, 지력=적 장수 등용, 통솔=방어, 정치=수입. 군주에 체크하면 그 세력 수도에 있어요. 이 기기에 저장되고, 일반회원으로 로그인하면 회원 기록과 함께 저장돼요.</p>'
  +'<div style="overflow:auto"><table><thead><tr><th>이름</th><th>소속</th><th>무력</th><th>지력</th><th>통솔</th><th>정치</th><th>군주</th><th></th></tr></thead><tbody>'+R.map(row).join('')+'</tbody></table></div>'
  +'<details style="margin-top:8px"><summary style="font-weight:900;cursor:pointer">📋 여러 명 한꺼번에 넣기</summary><p style="font-size:12px;margin:6px 0">한 줄에 한 명: <b>이름</b> 또는 <b>이름, 무력, 지력, 통솔, 정치</b> (능력치를 안 쓰면 무작위)</p><textarea data-g="bulk" style="height:110px" placeholder="홍길동&#10;김철수, 80, 60, 70, 50"></textarea><button class="sub" data-g="bulkadd">➕ 목록에 넣기</button></details>'+'<button class="sub" data-g="add">➕ 장수 추가</button><button class="big" data-g="save">💾 저장</button>'
  +'<details style="margin-top:10px"><summary>📤 내보내기 · 📥 가져오기 (다른 기기로 옮기기)</summary><textarea data-g="io">'+esc(JSON.stringify(R))+'</textarea><button class="sub" data-g="imp">📥 위 글로 바꾸기</button></details>'
  +'<button class="sub" data-g="close" style="background:#ffffff22">닫기</button></div>';
 ov.hidden=false;
 function collect(){var a=[];ov.querySelectorAll('tbody tr').forEach(function(tr){var g={};tr.querySelectorAll('[data-f]').forEach(function(inp){var f=inp.getAttribute('data-f');g[f]=f==='name'?inp.value.trim():f==='lord'?inp.checked:(function(v){return isNaN(v)?(f==='f'?-1:50):Math.max(f==='f'?-1:1,Math.min(100,v));})(parseInt(inp.value,10));});if(g.name)a.push(g);});return a;}
 ov.onclick=function(e){var b=e.target.closest('[data-g]');if(!b)return;var s=b.getAttribute('data-g');
  if(s==='bulkadd'){var tb2=ov.querySelector('tbody');ov.querySelector('[data-g="bulk"]').value.split('\n').forEach(function(l){var p=l.split(/[,，\t]/).map(function(x){return x.trim();});if(!p[0])return;var R2=function(i){var v=parseInt(p[i],10);return isNaN(v)?Math.round(rnd(30,95)):Math.max(1,Math.min(100,v));};tb2.insertAdjacentHTML('beforeend',row({name:p[0].slice(0,12),f:-1,war:R2(1),int:R2(2),lead:R2(3),pol:R2(4)},tb2.children.length));});ov.querySelector('[data-g="bulk"]').value='';toastIn(ov,'목록에 넣었어요. 💾 저장을 눌러 주세요.');return;}

  else if(s==='dice'){b.closest('tr').querySelectorAll('input[type=number]').forEach(function(inp){inp.value=Math.round(rnd(30,99));});}
  else if(s==='del'){b.closest('tr').remove();}
  else if(s==='save'){var a=collect();setReg(a);toastIn(ov,'💾 '+a.length+'명 저장했어요. 새 게임부터 나와요.');}
  else if(s==='imp'){try{var a2=JSON.parse(ov.querySelector('textarea').value);if(!Array.isArray(a2))throw 0;setReg(a2.slice(0,200));showGens();}catch(_){alert('글 모양이 맞지 않아요.');}}
  else if(s==='close'){ov.hidden=true;if(!G)showStart();}};}
function toastIn(ov,m){var t=ov.querySelector('.okmsg');if(!t){t=document.createElement('div');t.className='okmsg hint';ov.querySelector('.card').appendChild(t);}t.textContent=m;}
function showHelp(){var ov=root.querySelector('[data-ov="help"]');ov.innerHTML='<div class="card"><h3>❓ 도움말</h3><div style="line-height:1.8;font-size:14px">• 한 턴은 한 달이에요. 우리 역마다 한 달에 명령 하나(개발·징병·성벽·이동·공격)를 할 수 있어요.<br>• <b>공격</b>은 노선으로 이어진 이웃 적 역에만 할 수 있어요. 보낼 병력(%)을 정하고 빨간 테두리 역을 누르세요.<br>• 공격 병력×(1+무력) 이 방어 병력×(1+성벽)×(1+통솔)보다 크면 점령해요. 운도 조금 있어요.<br>• 태수가 있는 역에서 병력 절반 이상을 보내면 장수가 함께 가요.<br>• 매달 역마다 금(환승 노선이 많을수록·상권이 높을수록 많이)과 병사가 늘어요.<br>• 📋 명령의 <b>전선으로 모으기</b>로 뒤쪽 병력을 한 번에 앞으로 보낼 수 있어요.<br>• 모든 역을 차지하면 천하통일! 게임은 이 기기에 자동 저장돼요.</div><button class="sub" data-a="ovclose">닫기</button></div>';ov.hidden=false;}
function showEnd(){var ov=root.querySelector('[data-ov="end"]');ov.innerHTML='<div class="card" style="text-align:center"><h3>'+(G.over===1?'🏆 천하통일!':'💥 패배…')+'</h3><p>'+ym()+' · '+esc(FN(G.me))+'</p><button class="big" data-a="newg">🔄 새 게임</button><button class="sub" data-a="ovclose">지도 보기</button></div>';ov.hidden=false;}
