<script id="wk64-park-viewer">
(function(){
 'use strict';
 var ENDPOINT='https://script.google.com/macros/s/AKfycbyIWLNPDMsJjpZqJv_GxctUHtInNss9xs9ZT7SWMCE--uxVu4JcDupuiXp89XwEGAHY/exec';
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
 function say(t,bad){var n=document.getElementById('wk64Note');if(!n){n=document.createElement('div');n.id='wk64Note';n.setAttribute('role','status');n.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147483400;max-width:calc(100vw - 32px);border-radius:12px;padding:10px 16px;font:700 14px system-ui,sans-serif;box-shadow:0 6px 20px #0006;text-align:center;color:#fff';document.body.appendChild(n);}n.style.background=bad?'#8a2b2b':'#173b5c';n.textContent=t;clearTimeout(say.t);say.t=setTimeout(function(){n.remove();},6000);}
 function post1(action,extra,wait){var nonce='wk64_'+Date.now()+'_'+Math.random().toString(36).slice(2);return new Promise(function(resolve,reject){
  var f=document.createElement('iframe');f.name='wk64_'+nonce;f.style.cssText='display:none;width:0;height:0;border:0';
  var fm=document.createElement('form');fm.method='POST';fm.action=ENDPOINT;fm.target=f.name;fm.style.display='none';
  var ta=document.createElement('textarea');ta.name='payload';ta.value=JSON.stringify(Object.assign({action:action,_wonkiNonce:nonce},extra||{}));fm.appendChild(ta);
  var done=false;function fin(fn,v){if(done)return;done=true;clearTimeout(tm);window.removeEventListener('message',on);fm.remove();f.remove();fn(v);}
  function on(e){var d=e.data;if(!d||d.type!=='wonki-cloud-response'||d.nonce!==nonce)return;var v=d.payload||{};v.success?fin(resolve,v):fin(reject,new Error(v.message||'서버 요청 실패'));}
  var tm=setTimeout(function(){fin(reject,new Error('서버 응답 시간 초과'));},wait||25000);window.addEventListener('message',on);document.body.append(f,fm);fm.submit();});}
 async function post(a,x,wait){for(var i=0;i<3;i++){try{return await post1(a,x,wait);}catch(e){if(i===2||!/시간/.test(String(e&&e.message)))throw e;}}}
 function session(){try{return JSON.parse(sessionStorage.getItem('wonkiLand_general_session_v1')||'null');}catch(_){return null;}}
 function mkey(){var s=session(),m=s&&s.member||{};return s?encodeURIComponent(String(m.id||m.nickname||m.name||'guest')):'guest';}
 function parkOf(raw){try{var d=JSON.parse(raw||'null');var b=d&&d.state&&d.state.buildings;return Array.isArray(b)?b:[];}catch(_){return [];}}
 /* ---- 방문자: 내 공원 공유하기 ---- */
 async function showOff(){
  if(window.WonkiParkRoles66&&!window.WonkiParkRoles66.canBuild()){window.WonkiParkRoles66.askJoin('share');return;}
  var raw=null;try{raw=localStorage.getItem('wonkiParkDraft37_'+mkey());}catch(_){}
  var list=parkOf(raw);
  if(!list.length){alert('아직 지은 건물이 없어요. 🏗 건물 짓기로 공원을 꾸민 뒤 공유해 주세요!');return;}
  var s=session(),def=(s&&s.member&&(s.member.nickname||s.member.name))||'';
  var name=prompt('📣 내 공원 공유하기\n\n건물 '+list.length+'개가 있는 내 공원을 원기랜드 주인장에게 공유합니다.\n이름(별명)을 적어 주세요.',def);if(name===null)return;name=String(name).trim();if(!name){alert('이름을 적어 주세요.');return;}
  var msg=prompt('관리자에게 남길 한마디 (없어도 돼요)','');if(msg===null)return;
  say('📣 공원을 공유하는 중이에요…');
  var visitor='';try{visitor=localStorage.getItem('wonkiLand_daily_visitor_id_v1')||'';}catch(_){}
  try{var r=await post('park_showcase_save',{name:name,message:msg,park:raw,visitorId:visitor});say('📣 '+(r.message||'공원을 공유했어요!'));}
  catch(e){say(/지원하지 않는/.test(String(e.message))?'📣 서버가 아직 공원 공유하기를 지원하지 않아요 (서버 업데이트 필요)':'📣 공유하지 못했어요: '+e.message,true);}
 }
 /* ---- 관리자: 회원 공원 구경하기 ---- */
 function mapSVG(list){
  var art=window.WonkiParkEditor36&&window.WonkiParkEditor36.art;var wa=document.getElementById('wk44WorldArt');
  var g='<svg class="wk64-map" viewBox="-600 -225.2 2350 1154.2" role="img" aria-label="공원 지도">'+(wa&&wa.src?'<image href="'+esc(wa.src)+'" x="-600" y="-225.2" width="2350" height="1154.2" preserveAspectRatio="none"/>':'');
  list.forEach(function(b){var sc=Number(b.scale)||1,x=(Number(b.x)||0)*1000,y=(Number(b.y)||0)*563;
   g+='<g transform="translate('+x+' '+y+')"><g transform="scale('+(1.15*sc)+') rotate('+(Number(b.rotation)||0)+') translate(-50 -80)">'+(art?art(b.type):'<rect width="100" height="100" fill="#ffcf3f"/>')+'</g><text x="0" y="'+Math.max(28,65*sc)+'" text-anchor="middle" font-size="16" font-weight="bold" stroke="#fff" stroke-width="3" paint-order="stroke" fill="#173b5c">'+esc(b.name||'')+'</text></g>';});
  return g+'</svg>';}
 function stats(keys){var out=[];function rd(k){try{return JSON.parse(keys[k]||'null');}catch(_){return null;}}
  var m=rd('wonki_dbz_math_v2');if(m){var grades=[m].concat(['g12','g21','g22','g31','g32'].map(function(k){return m[k];}).filter(Boolean));var w=0,so=0,fr=0;grades.forEach(function(x){w+=Number(x.wins||0);so+=Number(x.solved||0);fr+=(x.friends||[]).length;});out.push('🐉 수학 승리 '+w+' · 맞힌 문제 '+so+' · 친구 '+fr+'명'+(m.activeGrade?' · 최근 '+m.activeGrade:''));}
  var e=rd('wonkiland_dbz_english_v1');if(e)out.push('🔤 영어 승리 '+Number(e.wins||0)+' · 맞힌 문제 '+Number(e.solved||0)+' · 친구 '+(e.friends||[]).length+'명');
  return out;}
 function when(t){if(!t)return '';var d=new Date(t);return isNaN(d)?String(t):d.toLocaleString('ko-KR');}
 var data=null,tab='members',view='list';
 /* 67차: 나가기 칸(위·아래 고정), Esc·바깥 누르기·휴대폰 뒤로 가기로 나가기 */
 function exitAll(){var o=document.getElementById('wk64Viewer');if(o)o.remove();view='list';if(history.state&&history.state.wk67)try{history.back();}catch(_){}}
 function box(){var o=document.getElementById('wk64Viewer');if(o)return o;o=document.createElement('div');o.id='wk64Viewer';o.className='wk36-modal';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.tabIndex=-1;o.innerHTML='<section class="wk36-card"></section>';document.body.appendChild(o);
  o.addEventListener('click',function(e){if(e.target===o)exitAll();});
  try{history.pushState({wk67:1},'',location.href);}catch(_){}
  setTimeout(function(){o.focus();},0);return o;}
 document.addEventListener('keydown',function(e){if(e.key!=='Escape'||!document.getElementById('wk64Viewer'))return;e.preventDefault();e.stopPropagation();view==='one'&&data?paintList():exitAll();},true);
 window.addEventListener('popstate',function(){var o=document.getElementById('wk64Viewer');if(!o)return;if(view==='one'&&data){paintList();try{history.pushState({wk67:1},'',location.href);}catch(_){}}else{o.remove();view='list';}});
 function head(title,inOne){return '<header class="wk67-head"><h2>'+esc(title)+'</h2><span>'+(inOne&&data?'<button type="button" data-back>◀ 목록</button>':'')+'<button type="button" class="wk67-x" data-x aria-label="구경하기 나가기">✕ 나가기</button></span></header>';}
 function foot(inOne){return '<div class="wk67-foot">'+(inOne&&data?'<button type="button" data-back>◀ 회원 목록으로</button>':'')+'<button type="button" class="wk67-x" data-x>✕ 구경하기 나가기</button></div>';}
 function parkList(m){var keys={};try{keys=JSON.parse(m.progress||'{}').keys||{};}catch(_){}var list=[];Object.keys(keys).forEach(function(k){if(/^wonkiParkDraft37_/.test(k)&&!/_focus$/.test(k))list=list.concat(parkOf(keys[k]));});return {keys:keys,list:list};}
 function paintList(){view='list';var c=box().querySelector('.wk36-card');var mem=data.members||[],sh=data.showcases||[];
  var withRec=mem.filter(function(m){return m.progress;}).length;
  var h=head('🔍 회원 공원 구경하기')+'<p class="wk36-status">회원 이름을 누르면 그 회원의 공원과 기록을 볼 수 있어요. (관리자 전용)</p>';
  if(data.status)h+='<div class="wk72-st'+(data.statusBad?' bad':'')+'">'+esc(data.status)+'</div>';
  if(data.oldServer)h+='<div class="wk68-warn"><b class="t">⚠ 회원 서버가 아직 예전 코드예요</b>그래서 회원 명단만 보이고, 회원 공원·게임 기록·공유한 공원은 안 보여요.<br>66차 안내의 <b>Code.gs(서버에 붙여넣기)</b>를 붙여넣고 <b>배포 관리 → 연필(수정) → 새 버전 → 배포</b>를 해 주세요. ("새 배포"를 누르면 주소가 바뀌어 연결이 안 돼요.)</div>';else if(data.error)h+='<div class="wk68-warn">⚠ 회원 공원 기록을 불러오지 못했어요: '+esc(data.error)+'</div>';
  h+='<div class="wk64-tabs"><button type="button" data-tab="members" class="'+(tab==='members'?'on':'')+'">👤 일반회원 '+mem.length+'명</button><button type="button" data-tab="show" class="'+(tab==='show'?'on':'')+'">📣 공유한 공원 '+sh.length+'개</button></div><div class="wk64-list">';
  if(tab==='members'){if(!mem.length)h+='<div class="wk64-empty">'+(data.partial?'⏳ 불러오는 중이에요…':'아직 가입한 일반회원이 없어요.')+'</div>';else if(!data.partial)h+='<div class="wk67-note">기록 있음 '+withRec+'명 · 아직 로그인 기록 없음 '+(mem.length-withRec)+'명</div>';
   mem.forEach(function(m,i){var r=parkList(m);var info=[m.name&&m.nickname&&m.name!==m.nickname?m.name:'',m.relationship||''].filter(Boolean).join(' · ');
    h+='<button type="button" class="wk64-item'+(m.progress?'':' wk67-none')+'" data-m="'+i+'"><b>'+esc(m.nickname||m.name||m.id)+'<em>보기 ▶</em></b>'+(info?'<small>'+esc(info)+'</small>':'')+(m.progress?'<small>🏗 건물 '+r.list.length+'개 · '+esc(when(m.savedAt))+'</small><small>'+esc(stats(r.keys).join(' / ')||'게임 기록 없음')+'</small>':(data.partial?'<small>⏳ 공원·기록 불러오는 중…</small>':data.oldServer?'<small>서버 업데이트 후 공원·기록이 보여요</small>':'<small>아직 로그인해서 저장한 기록이 없어요</small>'))+'</button>';});}
  else{if(!sh.length)h+='<div class="wk64-empty">아직 공유된 공원이 없어요.</div>';
   sh.forEach(function(s,i){h+='<button type="button" class="wk64-item" data-s="'+i+'"><b>'+esc(s.name)+'<em>보기 ▶</em></b><small>건물 '+Number(s.count||0)+'개 · '+esc(when(s.time))+'</small>'+(s.message?'<small>💬 '+esc(s.message)+'</small>':'')+'</button>';});}
  c.innerHTML=h+'</div>'+foot(false);c.scrollTop=0;bind(c);}
 function paintOne(title,sub,list,st,empty){view='one';var c=box().querySelector('.wk36-card');
  c.innerHTML=head(title,true)+'<p class="wk36-status">'+esc(sub)+'</p>'+(st&&st.length?'<div class="wk64-stats">'+st.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>':'')+(list.length?mapSVG(list):'<div class="wk64-empty">'+esc(empty||'지은 건물이 없어요.')+'</div>')+foot(true);c.scrollTop=0;bind(c);}
 function bind(c){c.querySelectorAll('[data-x]').forEach(function(b){b.onclick=exitAll;});c.querySelectorAll('[data-back]').forEach(function(b){b.onclick=paintList;});
  c.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;paintList();};});
  c.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){var m=data.members[+b.dataset.m],r=parkList(m);var info=[m.name,m.relationship].filter(Boolean).join(' · ');
   if(!m.progress&&data.partial){paintOne('👤 '+(m.nickname||m.name||m.id)+'님의 공원',(info?info+' · ':'')+'불러오는 중',[],[],'⏳ 이 회원의 공원·기록을 아직 불러오는 중이에요. ◀ 목록으로 돌아가 잠시 뒤 다시 눌러 주세요.');return;}
   if(!m.progress&&data.oldServer){paintOne('👤 '+(m.nickname||m.name||m.id)+'님의 공원',(info?info+' · ':'')+'서버 업데이트가 필요해요',[],[],'회원 서버가 예전 코드라 이 회원의 공원과 기록을 아직 불러올 수 없어요. 서버 코드를 바꾸면 보입니다.');return;}
   if(!m.progress){paintOne('👤 '+(m.nickname||m.name||m.id)+'님의 공원',(info?info+' · ':'')+'아직 저장된 기록이 없어요',[],[],'이 회원은 아직 로그인해서 공원·게임 기록을 저장하지 않았어요. 회원이 로그인하면 자동으로 저장됩니다.');return;}
   paintOne('👤 '+(m.nickname||m.name||m.id)+'님의 공원',(info?info+' · ':'')+'저장 시각 '+when(m.savedAt)+' · 건물 '+r.list.length+'개',r.list,stats(r.keys));};});
  c.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){var s=data.showcases[+b.dataset.s],list=parkOf(s.park);paintOne('📣 '+s.name+'님이 공유한 공원',when(s.time)+(s.message?' · 💬 '+s.message:'')+' · 건물 '+list.length+'개',list,[]);};});}
 /* 가입한 일반회원 명단과 진행 기록 합치기 */
 function mergeMembers(rec,all){var by={},out=[];(rec||[]).forEach(function(m){by[m.id]=m;out.push(m);});
  (all||[]).forEach(function(f){if(!f||!f.id||f.deleted||f.deletedAt)return;var m=by[f.id];if(m){m.nickname=m.nickname||f.nickname||'';m.name=m.name||f.name||'';m.relationship=f.relationship||f.category||'';}else out.push({id:f.id,nickname:f.nickname||'',name:f.name||'',relationship:f.relationship||f.category||'',savedAt:'',progress:''});});
  out.sort(function(a,b){if(!!a.progress!==!!b.progress)return a.progress?-1:1;if(a.progress)return String(b.savedAt).localeCompare(String(a.savedAt));return String(a.nickname||a.name).localeCompare(String(b.nickname||b.name),'ko');});return out;}
 /* 72차: 누르자마자 화면을 열고, 지난번 자료 → 회원 명단(빠름) → 공원 기록(느림) 순서로 채움. 두 번 눌러도 요청이 겹치지 않음 */
 var loading=false,VCACHE='wk72_viewer_cache';
 function setStatus(t,bad){if(!data)return;data.status=t;data.statusBad=!!bad;var n=document.querySelector('#wk64Viewer .wk72-st');if(n){n.textContent=t;n.classList.toggle('bad',!!bad);}}
 function saveCache(d){try{var t=JSON.stringify({t:Date.now(),members:d.members,showcases:d.showcases});if(t.length<2500000)localStorage.setItem(VCACHE,t);else localStorage.removeItem(VCACHE);}catch(_){try{localStorage.removeItem(VCACHE);}catch(__){}}}
 function readCache(){try{return JSON.parse(localStorage.getItem(VCACHE)||'null');}catch(_){return null;}}
 async function viewer(){
  if(typeof window.wonkiLandAdminLogin!=='function'){alert('관리자 로그인 기능을 찾을 수 없습니다. 페이지를 새로고침해 주세요.');return;}
  if(location.protocol!=='https:'){alert('Neocities의 https:// 주소에서 열어 주세요.');return;}
  if(loading){if(data){view==='one'||paintList();}return;}
  loading=true;var t0=Date.now();
  try{
   var cache=readCache();tab='members';
   if(cache&&cache.members){data={members:cache.members,showcases:cache.showcases||[],status:'⏳ 최신 자료를 불러오는 중… (지난번 '+new Date(cache.t).toLocaleString('ko-KR')+' 자료를 먼저 보여 줘요)'};}
   else data={members:[],showcases:[],partial:true,status:'⏳ 회원 명단을 불러오는 중…'};
   paintList();
   var tok;try{tok=await window.wonkiLandAdminLogin();}catch(e){if(cache)setStatus('⚠ 관리자 로그인 실패: '+(e&&e.message||e)+' (지난 자료를 보여 주는 중)',true);else showError('관리자 로그인 실패: '+(e&&e.message||e));return;}
   var pDone=false;
   var fr=post('admin_friend_list',{idToken:tok},30000).then(function(r){return r;},function(e){return {members:[],err:e};});
   var pr=post('admin_park_list',{idToken:tok},60000).then(function(r){return r;},function(e){return {err:e};});
   fr.then(function(f){if(pDone||cache||f.err)return;data.members=mergeMembers([],f.members);data.partial=true;data.status='⏳ 회원 '+data.members.length+'명 · 공원·게임 기록을 불러오는 중… (구글 서버가 느리면 30초쯤 걸려요)';if(view==='list')paintList();});
   var p=await pr,f=await fr;pDone=true;
   var oldServer=p.err&&/지원하지 않는/.test(String(p.err.message));
   if(p.err&&!oldServer){
    var msg='공원 기록을 불러오지 못했어요: '+(p.err.message||p.err);
    if(cache){setStatus('⚠ '+msg+' (지난 자료를 보여 주는 중) · 🔍 버튼을 다시 누르면 다시 불러와요',true);return;}
    if(f.err){showError(msg);return;}
    data={members:mergeMembers([],f.members),showcases:[],error:String(p.err.message||p.err),status:'⚠ '+msg+' · 🔍 버튼을 다시 누르면 다시 불러와요',statusBad:true};
   }else{
    data=p.err?{members:[],showcases:[],oldServer:true}:p;
    data.members=mergeMembers(data.members,f.members);
    if(!oldServer)saveCache(data);
    data.status='✓ 최신 자료 · '+Math.max(1,Math.round((Date.now()-t0)/1000))+'초 걸림';
   }
   markAdmin();if(view==='list'&&document.getElementById('wk64Viewer'))paintList();
   say(oldServer?'🔍 회원 명단만 보여요 · 서버 코드 업데이트가 필요해요':'🔍 일반회원 '+(data.members||[]).length+'명 · 공유한 공원 '+(data.showcases||[]).length+'개',oldServer);
  }finally{loading=false;}
 }
 function showError(msg){data=null;view='one';var c=box().querySelector('.wk36-card');c.innerHTML=head('🔍 회원 공원 구경하기')+'<div class="wk68-warn">⚠ '+esc(msg)+'</div>'+foot(false);bind(c);}
 /* 서버가 몇 차 기능까지 지원하는지 (공개 요청으로 확인) */
 var serverInfo=null;
 async function checkServer(){if(serverInfo)return serverInfo;try{await post('owner_park_load',{});serverInfo={ok:true};}catch(e){serverInfo={ok:!/지원하지 않는/.test(String(e.message)),msg:String(e.message)};}return serverInfo;}
 function install(){var tools=document.querySelector('#wonkiScrollMap .wonki-map-buttons');if(!tools||document.getElementById('wk64ShowOff'))return;
  var a=document.createElement('button');a.type='button';a.id='wk64ShowOff';a.textContent='📣 내 공원 공유하기';a.onclick=showOff;tools.appendChild(a);
  var v=document.createElement('button');v.type='button';v.id='wk64Viewer_btn';v.textContent='🔒 회원 공원 구경하기';v.title='관리자 Google 계정 전용';v.onclick=viewer;v.hidden=!isAdminDevice();tools.appendChild(v);}
 document.addEventListener('wonki-main-map-ready',install);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
 window.addEventListener('load',install,{once:true});
 /* ---- 65차: 관리자 기기 표시 + 관리자 메뉴의 방문자 통계 ---- */
 var ADMIN_FLAG='wk65_admin_device';
 function isAdminDevice(){try{return localStorage.getItem(ADMIN_FLAG)==='1';}catch(_){return false;}}
 function markAdmin(){try{localStorage.setItem(ADMIN_FLAG,'1');}catch(_){}var v=document.getElementById('wk64Viewer_btn');if(v)v.hidden=false;}
 function cachedToken(){try{var t=sessionStorage.getItem('wk64_admin_token');if(!t)return '';var e=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000;return e-Date.now()>300000?t:'';}catch(_){return '';}}
 function n(v){return Number(v||0).toLocaleString('ko-KR');}
 function paintStats(el,d,note){
  var h='<h3>📊 방문자 통계</h3><div class="wk65-tiles"><div><b>'+n(d.today)+'</b>오늘</div>'+(d.week!=null?'<div><b>'+n(d.week)+'</b>최근 7일</div>':'')+(d.month!=null?'<div><b>'+n(d.month)+'</b>최근 30일</div>':'')+'<div><b>'+n(d.total)+'</b>전체</div></div>';
  var days=(d.days||[]).slice(-14);
  if(days.length){var mx=Math.max.apply(null,days.map(function(x){return x.count;}).concat([1]));
   h+='<div class="wk65-bars">'+days.map(function(x){return '<span title="'+esc(x.day)+' '+x.count+'명" style="height:'+Math.round(x.count/mx*100)+'%"></span>';}).join('')+'</div><div class="wk65-days">'+days.map(function(x){return '<span>'+esc(String(x.day).slice(5).replace('-','/'))+'<br>'+x.count+'</span>';}).join('')+'</div>';}
  h+='<small>'+esc(note||'')+'</small>';
  if(d.week==null)h+='<button type="button" data-wk65-more>📈 7일·30일·날짜별 통계 보기 (관리자 Google 로그인)</button>';
  el.innerHTML=h;var b=el.querySelector('[data-wk65-more]');if(b)b.onclick=function(){loadStats(el,true);};}
 async function loadStats(el,login){
  var tok=cachedToken();
  if(!tok&&login){try{tok=await window.wonkiLandAdminLogin();}catch(e){el.querySelector('small').textContent='관리자 Google 로그인 실패: '+(e&&e.message||e);return;}}
  if(!tok)return;
  el.querySelector('small').textContent='자세한 통계를 불러오는 중…';
  try{var r=await post('admin_visitor_stats',{idToken:tok});markAdmin();el.dataset.full='1';paintStats(el,r,'한국 시간 기준 · 같은 브라우저는 하루 1번 집계 · '+new Date().toLocaleTimeString('ko-KR')+' 기준');}
  catch(e){el.querySelector('small').textContent=/지원하지 않는/.test(String(e.message))?'자세한 통계는 서버 업데이트(Code_65.gs) 후에 보입니다.':'자세한 통계를 불러오지 못했어요: '+e.message;}}
 function adminMenu(box,closeEditor){
  markAdmin();
  var v=document.createElement('button');v.type='button';v.textContent='🔍 회원 공원 구경하기';v.onclick=function(){closeEditor&&closeEditor();viewer();};
  var st=document.createElement('div');st.id='wk65Stats';
  var head=box.querySelector('p.wk36-status');if(head)head.after(st,v);else box.append(st,v);
  var s=window.WonkiVisitorSummary31,c=null;try{c=JSON.parse(localStorage.getItem('wonkiVisitorSummary31')||'null');}catch(_){}
  var base=s||c||{};
  paintStats(st,{today:base.today,total:base.total},s?'페이지의 방문 집계 기준 ('+(base.day||'')+')':c?'저장된 마지막 집계 ('+(c.day||'')+')':'방문 집계를 아직 불러오지 못했어요.');
  if(!s)document.addEventListener('wonki-visitor-summary31',function f(e){if(document.body.contains(st)&&!st.dataset.full)paintStats(st,e.detail,'페이지의 방문 집계 기준 ('+(e.detail.day||'')+')');},{once:true});
  loadStats(st,false);
  var sv=document.createElement('div');sv.id='wk68Server';sv.className='wk68-server';sv.textContent='🖥 회원 서버 상태 확인 중…';st.before(sv);
  checkServer().then(function(r){sv.className='wk68-server '+(r.ok?'ok':'bad');sv.innerHTML=r.ok?'🖥 회원 서버: 최신 코드 ✅ (63~66차 기능 사용 가능)':'🖥 회원 서버: <b>예전 코드 ⚠</b> — 회원 공원 구경하기·회원 기록 저장·주인장 공원·7일 통계가 안 돼요. 66차 Code.gs를 붙여넣고 <b>배포 관리 → 수정 → 새 버전</b>을 해 주세요.';});
  try{window.WonkiVisitLog70&&window.WonkiVisitLog70.adminMenu(box);}catch(e){console.warn(e);}
  try{window.WonkiParkRoles66&&window.WonkiParkRoles66.adminMenu(box,closeEditor);}catch(e){console.warn(e);}}
 function showPark(title,sub,list){data=null;paintOne(title,sub,list,[]);}
 window.WonkiParkViewer={showOff:showOff,viewer:viewer,adminMenu:adminMenu,showPark:showPark,_render:function(d){data=d;tab='members';paintList();}};
})();
</script>
