<script id="wk68-fast-cloud">
/* 68차: 회원 서버 요청을 숨은 창(iframe) 대신 바로 주고받기(fetch).
   서버는 _wonkiNonce가 없으면 JSON으로 답하고 다른 사이트에서 읽어도 되게 열려 있습니다.
   바로 주고받기가 안 되는 브라우저에서는 예전 숨은 창 방식으로 자동 전환합니다. */
(function(){
 'use strict';
 var EP=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec(\?|$)/;
 var orig=HTMLFormElement.prototype.submit;
 var broken=false,netFails=0;
 /* 80차: 6시간 관리자 표를 이 화면(탭)에서도 쓰게 */
 try{var at=localStorage.getItem('wk80_admin_token');if(at){var ae=JSON.parse(atob(at.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000;if(ae-Date.now()>300000)sessionStorage.setItem('wk64_admin_token',at);else localStorage.removeItem('wk80_admin_token');}}catch(_){}
 window.WonkiFastCloud68={stats:{fetch:0,fallback:0}};
 HTMLFormElement.prototype.submit=function(){
  var f=this;
  try{
   if(!broken&&!f.dataset.wk68iframe&&window.fetch&&String(f.method).toLowerCase()==='post'&&EP.test(f.action)){
    var ta=f.querySelector('[name="payload"]');var body=ta&&JSON.parse(ta.value);var nonce=body&&body._wonkiNonce;
    if(nonce){
     delete body._wonkiNonce;
     /* 읽기 요청은 5초 안에 답이 없으면 같은 요청을 하나 더 보내고 먼저 온 답을 씁니다(구글 서버가 가끔 한 요청만 늦게 답함) */
     var read=/(_list|_load|_count|_stats)$|^admin_visit_log$/.test(String(body.action||''));
     var text=JSON.stringify(body),done=false,live=0,ctls=[],tm2=null,tries=0;
     /* 75차: 구글이 가끔 보내는 오류 페이지(JSON 아님)나 일시적인 오류는 바로 주고받기로 다시 시도.
        연결 자체가 막힌 경우(TypeError)만 세고, 두 번 연속일 때만 이 화면에서 숨은 창 방식으로 바꿈 */
     function one(){live++;tries++;var ctl=window.AbortController?new AbortController():null;if(ctl)ctls.push(ctl);
      return fetch(f.action,{method:'POST',body:text,credentials:'omit',cache:'no-store',redirect:'follow',signal:ctl?ctl.signal:undefined})
       .then(function(r){if(!r.ok){var he=new Error('HTTP '+r.status);he.name='BadReply';throw he;}return r.text();})
       .then(function(t){var j;try{j=JSON.parse(t);}catch(_){var pe=new Error('JSON 아님');pe.name='BadReply';throw pe;}
        if(j&&j.success===false&&/관리자 로그인이 만료/.test(String(j.message||'')))try{localStorage.removeItem('wk80_admin_token');sessionStorage.removeItem('wk64_admin_token');}catch(_){}
        if(done)return;done=true;netFails=0;clearTimeout(tm);clearTimeout(tm2);ctls.forEach(function(c){try{c.abort();}catch(_){}});window.WonkiFastCloud68.stats.fetch++;window.postMessage({type:'wonki-cloud-response',nonce:nonce,payload:j},'*');})
       .catch(function(e){live--;if(done)return;
        if(e&&e.name==='BadReply'&&tries<4){window.WonkiFastCloud68.stats.retry=(window.WonkiFastCloud68.stats.retry||0)+1;setTimeout(function(){if(!done)one();},700);return;}
        if(live>0)return;fail(e);});}
     function fail(e){if(done)return;done=true;clearTimeout(tm);clearTimeout(tm2);
      if(e&&e.name==='TypeError'){netFails++;if(netFails>=2)broken=true;}
      window.WonkiFastCloud68.stats.fallback++;console.warn('WonkiLand: 바로 주고받기 실패, 이번 요청만 숨은 창 방식으로',e&&e.name,e&&e.message);
      if(document.documentElement.contains(f)){f.dataset.wk68iframe='1';try{orig.call(f);}catch(_){}}}
     var tm=setTimeout(function(){ctls.forEach(function(c){try{c.abort();}catch(_){}});},read?40000:15000);
     if(read)tm2=setTimeout(function(){if(!done){window.WonkiFastCloud68.stats.hedge=(window.WonkiFastCloud68.stats.hedge||0)+1;one();}},5000);
     one();
     return;
    }
   }
  }catch(_){}
  return orig.call(this);
 };
})();
</script>
<script id="wk70-visit-source">
/* 70차·77차: 어디서 들어왔는지 첫 화면에서 기억 (페이지가 스스로 새로 고쳐도 유지되게 세션에 저장)
   wk70_src = 들어온 곳(카카오톡·네이버·추적 링크…), wk77_det = 상세(검색·블로그·사이트 주소·링크 이름) */
(function(){try{if(sessionStorage.getItem('wk70_src'))return;var ua=navigator.userAgent||'',host='',path='';
 try{if(document.referrer){var u=new URL(document.referrer);host=u.hostname.replace(/^www\.|^m\./,'');path=u.pathname;}}catch(_){}
 if(host===location.hostname)host='';
 var tag='';try{tag=(new URL(location.href).searchParams.get('src')||'').replace(/[<>"'=]/g,'').trim().slice(0,30);}catch(_){}
 var src='',det='';
 if(/KAKAOTALK/i.test(ua)){src='카카오톡';det='카톡 앱에서 열림';}
 else if(/Instagram/i.test(ua)){src='인스타그램';det='인스타 앱에서 열림';}
 else if(/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)){src='페이스북';det='페이스북 앱에서 열림';}
 else if(/BAND\//i.test(ua)){src='밴드';det='밴드 앱에서 열림';}
 else if(/NAVER\(|NAVER/i.test(ua)&&!host){src='네이버';det='네이버 앱에서 열림';}
 if(host){var h=host;
  if(/kakao/.test(h)){src=src||'카카오톡';det=det||'카카오 링크';}
  else if(/instagram\.com|l\.instagram\.com/.test(h)){src='인스타그램';det=det||'인스타그램 링크';}
  else if(/facebook\.com|fb\.(com|me)|l\.facebook\.com/.test(h)){src='페이스북';det=det||'페이스북 링크';}
  else if(/naver\.com$/.test(h)){src='네이버';det=/search/.test(h)?'네이버 검색':/blog/.test(h)?'네이버 블로그':/cafe/.test(h)?'네이버 카페':/band/.test(h)?'밴드':h;}
  else if(/daum\.net$/.test(h)){src='다음';det=/search/.test(h)?'다음 검색':/cafe/.test(h)?'다음 카페':h;}
  else if(/(^|\.)google\./.test(h)){src='구글';det='구글 검색';}
  else if(/youtube\.com$|youtu\.be$/.test(h)){src='유튜브';det='유튜브 링크';}
  else if(/band\.us$/.test(h)){src='밴드';det='밴드 링크';}
  else if(/(^|\.)(x|twitter)\.com$|^t\.co$/.test(h)){src='X(트위터)';det='X 링크';}
  else if(/threads\.(net|com)$/.test(h)){src='스레드';det='스레드 링크';}
  else if(/bing\.com$/.test(h)){src='기타 사이트';det='빙 검색';}
  else if(!src){src='기타 사이트';det=h;}}
 if(tag){var base=src;src='추적 링크';det=tag+(base&&base!=='추적 링크'?' ('+base+')':'');}
 if(!src){src='직접 입력·즐겨찾기';det='';}
 sessionStorage.setItem('wk70_src',src);sessionStorage.setItem('wk77_det',det.slice(0,40));}catch(_){}})();
</script>
