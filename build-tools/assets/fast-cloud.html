<script id="wk68-fast-cloud">
/* 68차: 회원 서버 요청을 숨은 창(iframe) 대신 바로 주고받기(fetch).
   서버는 _wonkiNonce가 없으면 JSON으로 답하고 다른 사이트에서 읽어도 되게 열려 있습니다.
   바로 주고받기가 안 되는 브라우저에서는 예전 숨은 창 방식으로 자동 전환합니다. */
(function(){
 'use strict';
 var EP=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec(\?|$)/;
 var orig=HTMLFormElement.prototype.submit;
 var broken=false;
 window.WonkiFastCloud68={stats:{fetch:0,fallback:0}};
 HTMLFormElement.prototype.submit=function(){
  var f=this;
  try{
   if(!broken&&!f.dataset.wk68iframe&&window.fetch&&String(f.method).toLowerCase()==='post'&&EP.test(f.action)){
    var ta=f.querySelector('[name="payload"]');var body=ta&&JSON.parse(ta.value);var nonce=body&&body._wonkiNonce;
    if(nonce){
     delete body._wonkiNonce;
     /* 읽기 요청은 5초 안에 답이 없으면 같은 요청을 하나 더 보내고 먼저 온 답을 씁니다(구글 서버가 가끔 한 요청만 늦게 답함) */
     var read=/(_list|_load|_count|_stats)$|^admin_visit_log$/.test(String(body.action||''));
     var text=JSON.stringify(body),done=false,live=0,ctls=[],failErr=null,tm2=null;
     function one(){live++;var ctl=window.AbortController?new AbortController():null;if(ctl)ctls.push(ctl);
      return fetch(f.action,{method:'POST',body:text,credentials:'omit',cache:'no-store',redirect:'follow',signal:ctl?ctl.signal:undefined})
       .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
       .then(function(j){if(done)return;done=true;clearTimeout(tm);clearTimeout(tm2);ctls.forEach(function(c){try{c.abort();}catch(_){}});window.WonkiFastCloud68.stats.fetch++;window.postMessage({type:'wonki-cloud-response',nonce:nonce,payload:j},'*');})
       .catch(function(e){live--;failErr=e;if(done||live>0)return;fail(e);});}
     function fail(e){if(done)return;done=true;clearTimeout(tm);clearTimeout(tm2);
      /* 서버가 답을 못 읽게 했거나 연결이 막힌 경우: 예전 방식으로 한 번 더 */
      if(!(e&&e.name==='AbortError'))broken=true;
      window.WonkiFastCloud68.stats.fallback++;console.warn('WonkiLand: 바로 주고받기 실패, 숨은 창 방식으로 전환',e&&e.message);
      if(document.documentElement.contains(f)){f.dataset.wk68iframe='1';try{orig.call(f);}catch(_){}}}
     var tm=setTimeout(function(){ctls.forEach(function(c){try{c.abort();}catch(_){}});},read?40000:15000);
     if(read)tm2=setTimeout(function(){if(!done){window.WonkiFastCloud68.stats.hedge=(window.WonkiFastCloud68.stats.hedge||0)+1;one();}},5000);
     one();
     return;
    }
   }
  }catch(_){}
  return orig.call(this);
 };
})();
</script>
<script id="wk70-visit-source">
/* 70차: 어디서 들어왔는지(카톡·인스타 등)를 첫 화면에서 기억. 페이지가 스스로 새로 고쳐도 유지되게 세션에 저장 */
(function(){try{if(sessionStorage.getItem('wk70_src'))return;var ua=navigator.userAgent||'',r='';try{r=document.referrer?new URL(document.referrer).hostname:'';}catch(_){}
 var s=/KAKAOTALK/i.test(ua)||/kakao/i.test(r)?'카카오톡':/Instagram/i.test(ua)||/instagram/i.test(r)?'인스타그램':/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)||/facebook|(^|\.)fb\.(com|me)$/i.test(r)?'페이스북':/NAVER\(|NAVER/i.test(ua)||/naver/i.test(r)?'네이버':/BAND\//i.test(ua)||/band\.us/i.test(r)?'밴드':/google\./i.test(r)?'구글':/daum\.|kakao\.com/i.test(r)?'다음':(r&&r!==location.hostname?'기타 링크':'직접 입력·즐겨찾기');
 sessionStorage.setItem('wk70_src',s);}catch(_){}})();
</script>
