<script id="wk50-final-script">
(function(){
 'use strict';
 function mapPicture(){
  var world=document.getElementById('wk44World'),art=document.getElementById('wk44WorldArt');
  if(world&&art&&art.src&&!world.dataset.wk50)  {world.dataset.wk50='1';world.style.setProperty('--wk50-world','url("'+art.src+'")');}
 }
 function nineFix(){
  var link=document.querySelector('[data-map-action="nine"]');if(!link||link.dataset.wk50)return;link.dataset.wk50='1';
  link.addEventListener('click',function(e){
   var v=document.getElementById('wonkiMapViewport'),o=document.getElementById('wk44Origin'),btn=document.getElementById('wk48Course9');if(!v||!o)return;
   e.preventDefault();e.stopImmediatePropagation();
   var list=document.getElementById('wonkiCourseList');if(list)list.hidden=true;document.getElementById('wonkiCourseMenuToggle')?.setAttribute('aria-expanded','false');
   var r=o.getBoundingClientRect(),vr=v.getBoundingClientRect();
   v.scrollBy({left:r.left+r.width*1.2-vr.left-vr.width/2,top:r.top+r.height*.62-vr.top-vr.height/2,behavior:'smooth'});
   if(btn)btn.click();
  },true);
 }
 /* 방명록을 방문자 수 옆에 붙입니다 */
 var docked=false;
 var KEEP=['position','left','right','top','bottom','transform','width','height','max-width','max-height','min-height','z-index','display','visibility'];
 function guest(){
  var total=document.getElementById('wonkiExtraVisitorCount'),card=document.getElementById('wonkiExtraCard'),chat=document.getElementById('wonkiLiveChat');
  if(!total||!card||!chat)return;
  var btn=document.getElementById('wk50GuestBtn');
  if(!btn){btn=document.createElement('button');btn.type='button';btn.id='wk50GuestBtn';btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-controls','wk50GuestPanel');btn.innerHTML='💬 방명록 <b id="wk50GuestCount"></b>';}
  if(total.nextSibling!==btn)total.parentNode.insertBefore(btn,total.nextSibling);
  var panel=document.getElementById('wk50GuestPanel');
  if(!panel){panel=document.createElement('div');panel.id='wk50GuestPanel';panel.hidden=true;}
  var row=card.querySelector('.wonkiDockVisitors')||card;
  if(panel.parentNode!==row)row.appendChild(panel);
  if(chat.parentNode!==panel)panel.appendChild(chat);
  docked=true;clean(chat);
  if(!btn.dataset.wk50){btn.dataset.wk50='1';btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var open=panel.hidden;panel.hidden=!open;btn.setAttribute('aria-expanded',String(open));if(open){chat.classList.remove('collapsed');var c=document.getElementById('wonkiChatCollapse');if(c){c.textContent='－';c.setAttribute('aria-expanded','true');}clean(chat);var m=document.getElementById('wonkiLiveChatMessages');if(m)m.scrollTop=m.scrollHeight;panel.scrollIntoView({block:'nearest',behavior:'smooth'});}});}
  count();
 }
 function clean(chat){if(!docked)return;KEEP.forEach(function(k){if(chat.style.getPropertyValue(k))chat.style.removeProperty(k);});}
 function count(){var m=document.getElementById('wonkiLiveChatMessages'),c=document.getElementById('wk50GuestCount');if(!m||!c)return;var n=m.querySelectorAll(':scope > :not(#wonkiLiveChatEmpty)').length;c.textContent=n?String(n):'';}
 function watch(){
  var chat=document.getElementById('wonkiLiveChat');
  if(chat&&window.MutationObserver&&!chat.dataset.wk50Watch){chat.dataset.wk50Watch='1';new MutationObserver(function(){var c=document.getElementById('wonkiLiveChat');if(c&&docked&&KEEP.some(function(k){return c.style.getPropertyValue(k);}))clean(c);}).observe(chat,{attributes:true,attributeFilter:['style']});}
  var m=document.getElementById('wonkiLiveChatMessages');if(m&&window.MutationObserver&&!m.dataset.wk50Watch){m.dataset.wk50Watch='1';new MutationObserver(count).observe(m,{childList:true});}
  var card=document.getElementById('wonkiExtraCard');if(card&&window.MutationObserver&&!card.dataset.wk50Watch){card.dataset.wk50Watch='1';new MutationObserver(function(){var t=document.getElementById('wonkiExtraVisitorCount'),b=document.getElementById('wk50GuestBtn');if(t&&b&&t.nextSibling!==b)guest();}).observe(card,{childList:true,subtree:true});}
 }
 function all(){try{mapPicture();}catch(_){}try{nineFix();}catch(_){}try{guest();watch();}catch(_){}}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',all,{once:true});else all();
 window.addEventListener('load',function(){all();setTimeout(all,400);setTimeout(all,1500);},{once:true});
 document.addEventListener('wonki-main-map-ready',all);
})();
</script>

 }
 function build(){
  var o=document.getElementById('wkUpdatePoster');if(o)return o;
  o=document.createElement('div');o.id='wkUpdatePoster';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','원기랜드 업데이트 안내');o.hidden=true;
  paint(o);document.body.appendChild(o);
  o.addEventListener('click',function(e){if(e.target===o)o._close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!o.hidden)o._close();});
  return o;
 }
 function show(){var o=build();view=LATEST();listMode=false;paint(o);o.hidden=false;o.querySelector('.wkp').scrollTop=0;setTimeout(function(){o.querySelector('.wkp-ok').focus({preventScroll:true});},50);}
 function reopenButton(){var tools=document.querySelector('#wonkiScrollMap .wonki-map-buttons');if(!tools||document.getElementById('wkUpdateReopen'))return;var b=document.createElement('button');b.type='button';b.id='wkUpdateReopen';b.textContent='📢 '+LATEST()+'차 업데이트 안내';b.onclick=show;tools.insertBefore(b,tools.firstChild);}
 function init(){reopenButton();var hidden=false;try{hidden=localStorage.getItem(KEY)===today();}catch(_){}if(!hidden)show();}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
 window.addEventListener('load',reopenButton,{once:true});
 window.WonkiUpdatePoster={show:show,data:WONKI_UPDATE};
})();
</script>
